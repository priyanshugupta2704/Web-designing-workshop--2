<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zomato Clone</title>
    <link rel="stylesheet" href="style.css">
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

header{
    background:#e23744;
    color:white;
    padding-bottom:40px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 50px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

.hero{
    text-align:center;
    margin-top:50px;
}

.hero h2{
    margin-bottom:20px;
    font-size:2rem;
}

.hero input{
    width:60%;
    max-width:500px;
    padding:12px;
    border:none;
    border-radius:5px;
}

.restaurants{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

.card{
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 4px 8px rgba(0,0,0,0.2);
    transition:0.3s;
    background:white;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:180px;
    object-fit:cover;
}

.card h3{
    padding:10px;
}

.card p{
    padding:0 10px 15px;
    color:gray;
}

@media(max-width:768px){

    nav{
        flex-direction:column;
        gap:10px;
    }

    .hero input{
        width:90%;
    }
}
</style>
</head>
<body>

    <!-- Header -->
    <header>
        <nav>
            <h1>Zomato</h1>
            <ul>
                <li>Home</li>
                <li>Restaurants</li>
                <li>Login</li>
                <li>Sign Up</li>
            </ul>
        </nav>

        <div class="hero">
            <h2>Discover the Best Food & Drinks</h2>
            <input type="text" id="searchBox" placeholder="Search Restaurant..." onkeyup="searchRestaurant()">
        </div>
    </header>

    <!-- Restaurant Section -->
    <section class="restaurants" id="restaurantList">

        <div class="card">
            <img src="https://media-assets.swiggy.com/swiggy/image/upload/f_auto,q_auto,fl_lossy/RX_THUMBNAIL/IMAGES/VENDOR/2026/5/19/d5bf6c92-d738-4968-9b43-6352e4ff272e_23942.JPG">
            <h3>Domino's Pizza</h3>
            <p>Pizza, Fast Food</p>
        </div>

        <div class="card">
            <img src="https://cdn4.singleinterface.com/files/banner_images/34404/3514_1761718791_hcbuckets.jpg" alt="KFC">
            <h3>KFC</h3>
            <p>Chicken, Burger</p>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/McDonald%27s_square_2020.svg" alt="McDonald's">
            <h3>McDonald's</h3>
            <p>Burger, Fries</p>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/c/cc/Burger_King_2020.svg" alt="Burger King">
            <h3>Burger King</h3>
            <p>Burger, Fast Food</p>
        </div>

        <div class="card">
            <img src="https://www.multivu.com/players/English/8139451-subway-new-fresh-forward-restaurant-design/image/subwayff8-1500081148341-108-HR.jpg" alt="Subway">
            <h3>Subway</h3>
            <p>Sandwich, Healthy Food</p>
        </div>

        <div class="card">
            <img src="https://upload.wikimedia.org/wikipedia/en/thumb/9/91/Haldiram%27s_2024_Logo.svg/1280px-Haldiram%27s_2024_Logo.svg.png"="haldiram" alt="Haldiram's">
            <h3>Haldiram's</h3>
            <p>North Indian</p>
        </div>

    </section>

    <script>
    function searchRestaurant() {

    let input =
    document.getElementById("searchBox").value.toLowerCase();

    let cards =
    document.querySelectorAll(".card");

    cards.forEach(card => {

        let name =
        card.querySelector("h3").textContent.toLowerCase();

        if(name.includes(input)){
            card.style.display = "block";
        }
        else{
            card.style.display = "none";
        }

    });
}</script>

</body>
</html>
